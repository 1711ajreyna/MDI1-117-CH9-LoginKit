name: iOS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and Test
        run: |
          xcodebuild \
            -project MDI1-117-Ch-9-LoginKit.xcodeproj \
            -scheme MDI1-117-Ch-9-LoginKit \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' \
            -configuration Debug \
            test
